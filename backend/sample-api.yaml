openapi: 3.0.0

info:
  title: Sample API
  version: 1.0.0

paths:
  /users:
    get:
      summary: Get all users
      responses:
        "200":
          description: Success

    post:
      summary: Create a user
      responses:
        "201":
          description: User created

  /orders:
    get:
      summary: Get all orders
      responses:
        "200":
          description: Success

  /orders/{id}:
    delete:
      summary: Delete an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order deleted